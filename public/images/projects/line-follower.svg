<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B0D"/>
      <stop offset="100%" stop-color="#111318"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#292D35" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Top App Navigation -->
  <rect x="0" y="0" width="1200" height="60" fill="#111318" stroke="#292D35" stroke-width="1"/>
  <rect x="30" y="18" width="24" height="24" rx="4" fill="#7BA7FF" fill-opacity="0.2" stroke="#7BA7FF" stroke-width="1.2"/>
  <text x="42" y="35" fill="#7BA7FF" font-family="monospace" font-size="13" font-weight="900" text-anchor="middle">RB</text>
  <text x="65" y="36" fill="#E9E7E1" font-family="system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="1">AUTONOMOUS LINE FOLLOWER BOT</text>
  <rect x="390" y="20" width="170" height="22" rx="4" fill="#1E222B" stroke="#7BA7FF" stroke-width="0.8"/>
  <text x="475" y="35" fill="#7BA7FF" font-family="monospace" font-size="10" text-anchor="middle" font-weight="600">● ICORT 2025 DRDO 2ND</text>
  <text x="960" y="36" fill="#858994" font-family="monospace" font-size="12">CHOPPER FREQ: 490Hz</text>

  <!-- Left: Kinematics & Chassis Schematic -->
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="600" height="535" rx="6" fill="#111318" stroke="#292D35" stroke-width="1"/>
    <rect x="0" y="0" width="600" height="40" rx="6" fill="#171A21" stroke="#292D35" stroke-width="1"/>
    <text x="20" y="25" fill="#E9E7E1" font-family="system-ui, sans-serif" font-weight="700" font-size="13">DIFFERENTIAL CHASSIS SCHEMATIC &amp; SENSOR ARRAY</text>
    <text x="500" y="25" fill="#7BA7FF" font-family="monospace" font-size="11">5-CH IR ARRAY</text>

    <!-- Floor Line (Black Track) -->
    <path d="M 300 60 Q 300 240 280 300 T 300 500" fill="none" stroke="#292D35" stroke-width="24" stroke-linecap="round"/>
    <path d="M 300 60 Q 300 240 280 300 T 300 500" fill="none" stroke="#7BA7FF" stroke-width="3" stroke-dasharray="6,6"/>

    <!-- Robot Chassis Body -->
    <g transform="translate(190, 180)">
      <!-- Main PCB base -->
      <rect x="0" y="0" width="220" height="230" rx="16" fill="#171A21" stroke="#7BA7FF" stroke-width="2"/>
      
      <!-- Microcontroller ATmega328P -->
      <rect x="65" y="80" width="90" height="50" rx="4" fill="#0A0B0D" stroke="#292D35" stroke-width="1.5"/>
      <text x="110" y="102" fill="#E9E7E1" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">ARDUINO UNO</text>
      <text x="110" y="118" fill="#858994" font-family="monospace" font-size="8" text-anchor="middle">ATmega328P · 16MHz</text>

      <!-- Left Wheel / Motor -->
      <rect x="-32" y="100" width="28" height="90" rx="6" fill="#111318" stroke="#7BA7FF" stroke-width="1.5"/>
      <text x="-18" y="150" fill="#7BA7FF" font-family="monospace" font-size="9" text-anchor="middle" transform="rotate(-90, -18, 150)">L-MOTOR</text>
      
      <!-- Right Wheel / Motor -->
      <rect x="224" y="100" width="28" height="90" rx="6" fill="#111318" stroke="#7BA7FF" stroke-width="1.5"/>
      <text x="238" y="150" fill="#7BA7FF" font-family="monospace" font-size="9" text-anchor="middle" transform="rotate(90, 238, 150)">R-MOTOR</text>

      <!-- Front Caster Ball -->
      <circle cx="110" cy="20" r="14" fill="#292D35" stroke="#E9E7E1" stroke-width="1.5"/>
      <text x="110" y="24" fill="#E9E7E1" font-family="monospace" font-size="8" text-anchor="middle">CASTER</text>

      <!-- 5-Channel IR Sensor Array Front Wing -->
      <rect x="20" y="-30" width="180" height="24" rx="4" fill="#0A0B0D" stroke="#7BA7FF" stroke-width="1.2"/>
      
      <!-- 5 IR Sensors -->
      <!-- S1 -->
      <circle cx="40" cy="-18" r="6" fill="#10B981"/>
      <text x="40" y="-35" fill="#858994" font-family="monospace" font-size="8" text-anchor="middle">S1 (0)</text>
      <!-- S2 -->
      <circle cx="75" cy="-18" r="6" fill="#10B981"/>
      <text x="75" y="-35" fill="#858994" font-family="monospace" font-size="8" text-anchor="middle">S2 (0)</text>
      <!-- S3 (Center On Line) -->
      <circle cx="110" cy="-18" r="7" fill="#7BA7FF" stroke="#A9C4FF" stroke-width="2"/>
      <text x="110" y="-35" fill="#7BA7FF" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">S3 [1]</text>
      <!-- S4 -->
      <circle cx="145" cy="-18" r="6" fill="#10B981"/>
      <text x="145" y="-35" fill="#858994" font-family="monospace" font-size="8" text-anchor="middle">S4 (0)</text>
      <!-- S5 -->
      <circle cx="180" cy="-18" r="6" fill="#10B981"/>
      <text x="180" y="-35" fill="#858994" font-family="monospace" font-size="8" text-anchor="middle">S5 (0)</text>

      <!-- Motor Driver L298N -->
      <rect x="65" y="150" width="90" height="50" rx="4" fill="#0A0B0D" stroke="#292D35" stroke-width="1.5"/>
      <text x="110" y="172" fill="#E9E7E1" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">L298N H-BRIDGE</text>
      <text x="110" y="188" fill="#C8B89A" font-family="monospace" font-size="8" text-anchor="middle">DUAL MOTOR DRIVER</text>
    </g>

    <text x="300" y="500" fill="#858994" font-family="monospace" font-size="11" text-anchor="middle">STATUS: LINE CENTERED · VELOCITY: 0.85 m/s · STEERING ERROR: 0.00°</text>
  </g>

  <!-- Right: Telemetry & PID Controller Readout -->
  <g transform="translate(680, 90)">
    <rect x="0" y="0" width="470" height="535" rx="6" fill="#111318" stroke="#292D35" stroke-width="1"/>
    <rect x="0" y="0" width="470" height="40" rx="6" fill="#171A21" stroke="#292D35" stroke-width="1"/>
    <text x="20" y="25" fill="#E9E7E1" font-family="system-ui, sans-serif" font-weight="700" font-size="13">TELEMETRY &amp; CLOSED-LOOP CONTROL</text>
    <text x="380" y="25" fill="#10B981" font-family="monospace" font-size="11">ACTIVE ●</text>

    <!-- Telemetry Cards -->
    <g transform="translate(20, 60)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="205" height="85" rx="4" fill="#171A21" stroke="#292D35" stroke-width="1"/>
      <text x="15" y="24" fill="#858994" font-family="monospace" font-size="10">LEFT PWM DUTY</text>
      <text x="15" y="58" fill="#7BA7FF" font-family="system-ui, sans-serif" font-weight="900" font-size="28">215 / 255</text>
      <text x="15" y="74" fill="#10B981" font-family="monospace" font-size="10">84.3% SPEED</text>

      <!-- Card 2 -->
      <rect x="225" y="0" width="205" height="85" rx="4" fill="#171A21" stroke="#292D35" stroke-width="1"/>
      <text x="240" y="24" fill="#858994" font-family="monospace" font-size="10">RIGHT PWM DUTY</text>
      <text x="240" y="58" fill="#7BA7FF" font-family="system-ui, sans-serif" font-weight="900" font-size="28">210 / 255</text>
      <text x="240" y="74" fill="#10B981" font-family="monospace" font-size="10">82.4% SPEED</text>
    </g>

    <!-- PID Loop Tuning -->
    <g transform="translate(20, 170)">
      <rect x="0" y="0" width="430" height="150" rx="4" fill="#171A21" stroke="#292D35" stroke-width="1"/>
      <text x="15" y="25" fill="#E9E7E1" font-family="monospace" font-size="11" font-weight="700">PROPORTIONAL-INTEGRAL-DERIVATIVE (PID) GAINS</text>
      
      <text x="15" y="60" fill="#858994" font-family="monospace" font-size="11">Kp (Proportional Gain):</text>
      <text x="350" y="60" fill="#7BA7FF" font-family="monospace" font-size="11" font-weight="700">18.5</text>

      <text x="15" y="90" fill="#858994" font-family="monospace" font-size="11">Ki (Integral Sum):</text>
      <text x="350" y="90" fill="#7BA7FF" font-family="monospace" font-size="11" font-weight="700">0.02</text>

      <text x="15" y="120" fill="#858994" font-family="monospace" font-size="11">Kd (Derivative Slope):</text>
      <text x="350" y="120" fill="#7BA7FF" font-family="monospace" font-size="11" font-weight="700">6.40</text>
    </g>

    <!-- Competition Specifications Box -->
    <g transform="translate(20, 345)">
      <rect x="0" y="0" width="430" height="160" rx="4" fill="#171A21" stroke="#7BA7FF" stroke-width="1" stroke-opacity="0.4"/>
      <text x="15" y="28" fill="#C8B89A" font-family="monospace" font-size="11" font-weight="700">EXHIBITION AWARDS &amp; RECOGNITION</text>
      
      <text x="15" y="60" fill="#E9E7E1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ITR-DRDO Chandipur, Odisha</text>
      <text x="15" y="80" fill="#858994" font-family="system-ui, sans-serif" font-size="11">4th International Conference on Range Technology (ICORT 2025)</text>
      <text x="15" y="105" fill="#7BA7FF" font-family="monospace" font-size="11" font-weight="700">🏆 2nd Position — Student Project Exhibition</text>
      <text x="15" y="130" fill="#858994" font-family="monospace" font-size="10">Demonstrated real-time trajectory tracking under ambient sensor noise.</text>
    </g>
  </g>
</svg>
