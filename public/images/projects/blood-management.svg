<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#141720"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7BA7FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A9C4FF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#292D35" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Top App Navigation -->
  <rect x="0" y="0" width="1200" height="60" fill="#111318" stroke="#292D35" stroke-width="1"/>
  <circle cx="35" cy="30" r="12" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1.5"/>
  <path d="M35 22 C35 22 28 30 28 34 C28 37.8 31.1 41 35 41 C38.9 41 42 37.8 42 34 C42 30 35 22 35 22 Z" fill="#EF4444"/>
  <text x="60" y="36" fill="#E9E7E1" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="1">BLOOD MANAGEMENT SYSTEM</text>
  <rect x="330" y="20" width="120" height="22" rx="4" fill="#1E222B" stroke="#7BA7FF" stroke-width="0.8"/>
  <text x="390" y="35" fill="#7BA7FF" font-family="monospace" font-size="10" text-anchor="middle" font-weight="600">● LIVE DISPATCH</text>

  <text x="800" y="36" fill="#858994" font-family="monospace" font-size="12">HOSPITAL NETWORK: ONLINE</text>
  <rect x="1040" y="16" width="130" height="28" rx="4" fill="#7BA7FF" fill-opacity="0.15" stroke="#7BA7FF" stroke-width="1"/>
  <text x="1105" y="34" fill="#A9C4FF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="700">+ NEW DONOR</text>

  <!-- Metric KPI Cards -->
  <g transform="translate(40, 85)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="260" height="95" rx="6" fill="#111318" stroke="#292D35" stroke-width="1"/>
    <text x="20" y="28" fill="#858994" font-family="monospace" font-size="11" letter-spacing="1">TOTAL REGISTERED DONORS</text>
    <text x="20" y="68" fill="#E9E7E1" font-family="system-ui, sans-serif" font-weight="900" font-size="34">248</text>
    <text x="100" y="66" fill="#10B981" font-family="monospace" font-size="12">↑ +14% this month</text>

    <!-- Card 2 -->
    <rect x="285" y="0" width="260" height="95" rx="6" fill="#111318" stroke="#292D35" stroke-width="1"/>
    <text x="305" y="28" fill="#858994" font-family="monospace" font-size="11" letter-spacing="1">UNITS IN INVENTORY</text>
    <text x="305" y="68" fill="#7BA7FF" font-family="system-ui, sans-serif" font-weight="900" font-size="34">394</text>
    <text x="385" y="66" fill="#7BA7FF" font-family="monospace" font-size="12">Across 8 Blood Types</text>

    <!-- Card 3 -->
    <rect x="570" y="0" width="260" height="95" rx="6" fill="#111318" stroke="#292D35" stroke-width="1"/>
    <text x="590" y="28" fill="#858994" font-family="monospace" font-size="11" letter-spacing="1">PENDING REQUESTS</text>
    <text x="590" y="68" fill="#EF4444" font-family="system-ui, sans-serif" font-weight="900" font-size="34">61</text>
    <text x="645" y="66" fill="#F87171" font-family="monospace" font-size="12">12 Critical Priority</text>

    <!-- Card 4 -->
    <rect x="855" y="0" width="265" height="95" rx="6" fill="#111318" stroke="#292D35" stroke-width="1"/>
    <text x="875" y="28" fill="#858994" font-family="monospace" font-size="11" letter-spacing="1">MATCH SUCCESS RATE</text>
    <text x="875" y="68" fill="#C8B89A" font-family="system-ui, sans-serif" font-weight="900" font-size="34">94.2%</text>
    <text x="980" y="66" fill="#10B981" font-family="monospace" font-size="12">Algorithmic Match</text>
  </g>

  <!-- Left Main Panel: Active Hospital Inventory & Match Engine -->
  <g transform="translate(40, 205)">
    <rect x="0" y="0" width="720" height="430" rx="6" fill="#111318" stroke="#292D35" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect x="0" y="0" width="720" height="44" rx="6" fill="#171A21" stroke="#292D35" stroke-width="1"/>
    <text x="25" y="27" fill="#E9E7E1" font-family="system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="0.5">CENTRALIZED BLOOD DISPATCH LOG</text>
    <text x="590" y="27" fill="#7BA7FF" font-family="monospace" font-size="11">ACID VERIFIED ●</text>

    <!-- Table Columns -->
    <g transform="translate(25, 65)">
      <text x="0" y="0" fill="#858994" font-family="monospace" font-size="10" letter-spacing="1">ENTRY ID</text>
      <text x="90" y="0" fill="#858994" font-family="monospace" font-size="10" letter-spacing="1">DONOR TYPE</text>
      <text x="200" y="0" fill="#858994" font-family="monospace" font-size="10" letter-spacing="1">UNITS</text>
      <text x="300" y="0" fill="#858994" font-family="monospace" font-size="10" letter-spacing="1">DESTINATION HOSPITAL</text>
      <text x="530" y="0" fill="#858994" font-family="monospace" font-size="10" letter-spacing="1">STATUS</text>
      <line x1="0" y1="12" x2="670" y2="12" stroke="#292D35" stroke-width="1"/>
    </g>

    <!-- Row 1 -->
    <g transform="translate(25, 105)">
      <text x="0" y="0" fill="#E9E7E1" font-family="monospace" font-size="12">#REQ-8041</text>
      <rect x="90" y="-12" width="34" height="18" rx="3" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="0.8"/>
      <text x="107" y="1" fill="#EF4444" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">O-</text>
      <text x="200" y="0" fill="#E9E7E1" font-family="monospace" font-size="12">4 Units</text>
      <text x="300" y="0" fill="#E9E7E1" font-family="system-ui, sans-serif" font-size="12">AIIMS Bhubaneswar - ICU Dept</text>
      <rect x="530" y="-12" width="80" height="18" rx="3" fill="#10B981" fill-opacity="0.2"/>
      <text x="570" y="1" fill="#10B981" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">DISPATCHED</text>
      <line x1="0" y1="18" x2="670" y2="18" stroke="#1E222B" stroke-width="1"/>
    </g>

    <!-- Row 2 -->
    <g transform="translate(25, 150)">
      <text x="0" y="0" fill="#E9E7E1" font-family="monospace" font-size="12">#REQ-8042</text>
      <rect x="90" y="-12" width="34" height="18" rx="3" fill="#7BA7FF" fill-opacity="0.2" stroke="#7BA7FF" stroke-width="0.8"/>
      <text x="107" y="1" fill="#7BA7FF" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">A+</text>
      <text x="200" y="0" fill="#E9E7E1" font-family="monospace" font-size="12">2 Units</text>
      <text x="300" y="0" fill="#E9E7E1" font-family="system-ui, sans-serif" font-size="12">Apollo Hospital - Surgery 2B</text>
      <rect x="530" y="-12" width="80" height="18" rx="3" fill="#7BA7FF" fill-opacity="0.2"/>
      <text x="570" y="1" fill="#7BA7FF" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">ALLOCATED</text>
      <line x1="0" y1="18" x2="670" y2="18" stroke="#1E222B" stroke-width="1"/>
    </g>

    <!-- Row 3 -->
    <g transform="translate(25, 195)">
      <text x="0" y="0" fill="#E9E7E1" font-family="monospace" font-size="12">#REQ-8043</text>
      <rect x="90" y="-12" width="34" height="18" rx="3" fill="#C8B89A" fill-opacity="0.2" stroke="#C8B89A" stroke-width="0.8"/>
      <text x="107" y="1" fill="#C8B89A" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">B+</text>
      <text x="200" y="0" fill="#E9E7E1" font-family="monospace" font-size="12">6 Units</text>
      <text x="300" y="0" fill="#E9E7E1" font-family="system-ui, sans-serif" font-size="12">KIMS Super Specialty - Trauma</text>
      <rect x="530" y="-12" width="80" height="18" rx="3" fill="#F59E0B" fill-opacity="0.2"/>
      <text x="570" y="1" fill="#F59E0B" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">MATCHING</text>
      <line x1="0" y1="18" x2="670" y2="18" stroke="#1E222B" stroke-width="1"/>
    </g>

    <!-- Row 4 -->
    <g transform="translate(25, 240)">
      <text x="0" y="0" fill="#E9E7E1" font-family="monospace" font-size="12">#REQ-8044</text>
      <rect x="90" y="-12" width="34" height="18" rx="3" fill="#7BA7FF" fill-opacity="0.2" stroke="#7BA7FF" stroke-width="0.8"/>
      <text x="107" y="1" fill="#7BA7FF" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">AB+</text>
      <text x="200" y="0" fill="#E9E7E1" font-family="monospace" font-size="12">1 Unit</text>
      <text x="300" y="0" fill="#E9E7E1" font-family="system-ui, sans-serif" font-size="12">SUM Ultimate Medicare</text>
      <rect x="530" y="-12" width="80" height="18" rx="3" fill="#10B981" fill-opacity="0.2"/>
      <text x="570" y="1" fill="#10B981" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">DISPATCHED</text>
      <line x1="0" y1="18" x2="670" y2="18" stroke="#1E222B" stroke-width="1"/>
    </g>

    <!-- Row 5 -->
    <g transform="translate(25, 285)">
      <text x="0" y="0" fill="#E9E7E1" font-family="monospace" font-size="12">#REQ-8045</text>
      <rect x="90" y="-12" width="34" height="18" rx="3" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="0.8"/>
      <text x="107" y="1" fill="#EF4444" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">O+</text>
      <text x="200" y="0" fill="#E9E7E1" font-family="monospace" font-size="12">3 Units</text>
      <text x="300" y="0" fill="#E9E7E1" font-family="system-ui, sans-serif" font-size="12">Capital Hospital Bhubaneswar</text>
      <rect x="530" y="-12" width="80" height="18" rx="3" fill="#7BA7FF" fill-opacity="0.2"/>
      <text x="570" y="1" fill="#7BA7FF" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">ALLOCATED</text>
      <line x1="0" y1="18" x2="670" y2="18" stroke="#1E222B" stroke-width="1"/>
    </g>

    <!-- Bottom telemetry line -->
    <rect x="25" y="360" width="670" height="40" rx="4" fill="#171A21" stroke="#292D35" stroke-width="0.8"/>
    <text x="45" y="385" fill="#858994" font-family="monospace" font-size="11">AUTO-SYNC: 120s INTERVAL · 256-BIT ENCRYPTED CHANNEL · REACT VIRTUAL DOM ACTIVE</text>
  </g>

  <!-- Right Panel: Blood Group Inventory Breakdown -->
  <g transform="translate(780, 205)">
    <rect x="0" y="0" width="380" height="430" rx="6" fill="#111318" stroke="#292D35" stroke-width="1"/>
    <rect x="0" y="0" width="380" height="44" rx="6" fill="#171A21" stroke="#292D35" stroke-width="1"/>
    <text x="20" y="27" fill="#E9E7E1" font-family="system-ui, sans-serif" font-weight="700" font-size="13">INVENTORY DISTRIBUTION</text>
    <text x="310" y="27" fill="#C8B89A" font-family="monospace" font-size="11">8 TYPES</text>

    <!-- Bars -->
    <g transform="translate(25, 75)">
      <!-- O+ -->
      <text x="0" y="0" fill="#E9E7E1" font-family="monospace" font-size="11" font-weight="700">O+ (92 units)</text>
      <rect x="0" y="10" width="330" height="8" rx="2" fill="#1E222B"/>
      <rect x="0" y="10" width="270" height="8" rx="2" fill="#7BA7FF"/>

      <!-- A+ -->
      <text x="0" y="45" fill="#E9E7E1" font-family="monospace" font-size="11" font-weight="700">A+ (78 units)</text>
      <rect x="0" y="55" width="330" height="8" rx="2" fill="#1E222B"/>
      <rect x="0" y="55" width="230" height="8" rx="2" fill="#7BA7FF"/>

      <!-- B+ -->
      <text x="0" y="90" fill="#E9E7E1" font-family="monospace" font-size="11" font-weight="700">B+ (84 units)</text>
      <rect x="0" y="100" width="330" height="8" rx="2" fill="#1E222B"/>
      <rect x="0" y="100" width="250" height="8" rx="2" fill="#7BA7FF"/>

      <!-- AB+ -->
      <text x="0" y="135" fill="#E9E7E1" font-family="monospace" font-size="11" font-weight="700">AB+ (42 units)</text>
      <rect x="0" y="145" width="330" height="8" rx="2" fill="#1E222B"/>
      <rect x="0" y="145" width="130" height="8" rx="2" fill="#C8B89A"/>

      <!-- O- (Critical) -->
      <text x="0" y="180" fill="#EF4444" font-family="monospace" font-size="11" font-weight="700">O- (18 units - CRITICAL LOW)</text>
      <rect x="0" y="190" width="330" height="8" rx="2" fill="#1E222B"/>
      <rect x="0" y="190" width="60" height="8" rx="2" fill="#EF4444"/>

      <!-- A- -->
      <text x="0" y="225" fill="#E9E7E1" font-family="monospace" font-size="11" font-weight="700">A- (24 units)</text>
      <rect x="0" y="235" width="330" height="8" rx="2" fill="#1E222B"/>
      <rect x="0" y="235" width="80" height="8" rx="2" fill="#7BA7FF"/>

      <!-- B- -->
      <text x="0" y="270" fill="#E9E7E1" font-family="monospace" font-size="11" font-weight="700">B- (36 units)</text>
      <rect x="0" y="280" width="330" height="8" rx="2" fill="#1E222B"/>
      <rect x="0" y="280" width="110" height="8" rx="2" fill="#7BA7FF"/>

      <!-- AB- -->
      <text x="0" y="315" fill="#E9E7E1" font-family="monospace" font-size="11" font-weight="700">AB- (20 units)</text>
      <rect x="0" y="325" width="330" height="8" rx="2" fill="#1E222B"/>
      <rect x="0" y="325" width="70" height="8" rx="2" fill="#C8B89A"/>
    </g>
  </g>
</svg>
